<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CPSC browser CORS probe</title>
  </head>
  <body>
    <output id="result">pending</output>
    <script>
      const endpoint = 'https://www.saferproducts.gov/RestWebServices/Recall?ProductName=stroller&format=json';
      const result = document.querySelector('#result');

      Promise.all([
        fetch(endpoint)
          .then(async (response) => ({
            fetchResolved: true,
            status: response.status,
            ok: response.ok,
            responseType: response.type,
            contentType: response.headers.get('content-type'),
            bodyPrefix: (await response.text()).slice(0, 120),
          }))
          .catch((error) => ({
            fetchResolved: false,
            errorName: error.name,
            errorMessage: error.message,
          })),
        fetch(endpoint, { mode: 'no-cors' })
          .then((response) => ({
            fetchResolved: true,
            status: response.status,
            responseType: response.type,
          }))
          .catch((error) => ({
            fetchResolved: false,
            errorName: error.name,
            errorMessage: error.message,
          })),
      ]).then(([cors, noCors]) => {
        result.textContent = JSON.stringify({ cors, noCors });
      });
    </script>
  </body>
</html>
